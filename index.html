<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مطبعة اللون الذهبي - النظام الموحد</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <style>
        * { font-family: 'Cairo', sans-serif !important; }
        body { background-color: #f4f7f6; margin: 0; padding-bottom: 90px; }
        .cust-card { background: white; border-radius: 15px; border-right: 8px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 15px; cursor: pointer; }
        .item-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; border-right: 4px solid #1a1a1a; margin-bottom: 10px; position: relative; }
        .gold-btn { background: linear-gradient(135deg, #d4af37 0%, #735c00 100%); color: white; border-radius: 12px; font-weight: bold; width: 100%; padding: 15px; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body>

<div id="app">
    <header class="bg-[#1a1a1a] p-4 flex justify-between items-center shadow-xl border-b-4 border-[#d4af37]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#d4af37] rounded-lg flex items-center justify-center font-bold text-black shadow-lg">G</div>
            <h1 class="text-white font-bold">مطبعة اللون الذهبي</h1>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <!-- شاشة الزبائن -->
        <div id="home-view">
            <div class="grid grid-cols-2 gap-3 mb-6 text-center">
                <div class="bg-white p-4 rounded-xl border-b-4 border-red-500 shadow-sm">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">الديون (متبقي)</p>
                    <p id="sum-rem" class="text-lg font-bold text-red-600">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl border-b-4 border-green-500 shadow-sm">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">المحصل</p>
                    <p id="sum-dep" class="text-lg font-bold text-green-600">0</p>
                </div>
            </div>
            <div id="cust-list" class="space-y-3"></div>
        </div>

        <!-- شاشة التفاصيل -->
        <div id="detail-view" style="display:none">
            <button onclick="goHome()" class="mb-4 text-gray-400 font-bold flex items-center">← رجوع</button>
            <div class="bg-black text-white p-5 rounded-3xl mb-5 relative shadow-xl border-r-8 border-[#d4af37]">
                <h2 id="det-name" class="text-xl font-bold mb-1"></h2>
                <p id="det-total" class="text-[#d4af37] text-xs font-bold"></p>
                <button onclick="window.print()" class="absolute top-4 left-4 bg-white/10 p-2 rounded-lg text-[10px]">PDF</button>
            </div>
            <button onclick="addMore()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold mb-5 shadow-md">+ طلب جديد لهذا الزبون</button>
            <div id="items-list"></div>
        </div>

        <!-- شاشة الإضافة -->
        <div id="add-view" style="display:none">
            <h2 class="text-xl font-bold mb-5 text-[#735c00]">إضافة شغل جديد</h2>
            <form id="order-form" onsubmit="saveData(event)" class="bg-white p-5 rounded-2xl shadow-lg space-y-4">
                <input type="text" id="in-c" placeholder="اسم الزبون" class="w-full p-3 border rounded-xl" required>
                <input type="text" id="in-i" placeholder="المنتج (مثلاً: كارتون)" class="w-full p-3 border rounded-xl" required>
                <textarea id="in-d" rows="3" placeholder="المواصفات الفنية..." class="w-full p-3 border rounded-xl"></textarea>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="in-q" placeholder="العدد" class="p-3 border rounded-xl" required>
                    <input type="number" id="in-p" placeholder="السعر الكلي" class="p-3 border rounded-xl" required>
                </div>
                <input type="number" id="in-dep" placeholder="العربون" class="p-3 border rounded-xl" value="0">
                <button type="submit" id="save-btn" class="gold-btn">تأكيد وحفظ الطلب ✅</button>
                <button type="button" onclick="goHome()" class="w-full text-gray-400 py-2">إلغاء</button>
            </form>
        </div>
    </main>

    <nav id="nav" class="fixed bottom-0 left-0 w-full bg-white border-t p-3 flex justify-around items-center shadow-2xl no-print z-50">
        <button onclick="goHome()" class="flex flex-col items-center text-[#d4af37]"><span class="material-symbols-outlined text-2xl">folder_shared</span><span class="text-[10px] font-bold">الزبائن</span></button>
        <button onclick="goAdd()" class="bg-black text-[#d4af37] w-14 h-14 rounded-full flex items-center justify-center -mt-10 border-4 border-[#f8fafc] shadow-xl"><span class="material-symbols-outlined text-3xl">add</span></button>
        <button onclick="alert('قسم التقارير قيد التطوير')" class="flex flex-col items-center text-gray-300"><span class="material-symbols-outlined text-2xl">analytics</span><span class="text-[10px]">التقارير</span></button>
    </nav>
</div>

<script>
    // إعدادات Firebase الخاصة بمشروعك
    var firebaseConfig = {
        apiKey: "AIzaSyBnfABXbY5qxnirc3sumFX4TTOtlfJEM7s",
        projectId: "golden-92eb1",
        appId: "1:682494914009:web:518e6365b0da3627affdc8"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();
    var allData = [];
    var currentCust = "";

    function goHome() { hideAll(); document.getElementById('home-view').style.display='block'; }
    
    function goAdd() { 
        hideAll(); 
        document.getElementById('in-c').value = "";
        document.getElementById('in-c').disabled = false; 
        document.getElementById('add-view').style.display='block'; 
        clearInputs();
    }
    
    function addMore() { 
        hideAll(); 
        document.getElementById('in-c').value = currentCust; 
        document.getElementById('in-c').disabled = true; 
        document.getElementById('add-view').style.display='block'; 
        clearInputs();
    }
    
    function hideAll() { ['home-view','detail-view','add-view'].forEach(id => document.getElementById(id).style.display='none'); }
    
    function clearInputs() {
        document.getElementById('in-i').value = "";
        document.getElementById('in-d').value = "";
        document.getElementById('in-q').value = "";
        document.getElementById('in-p').value = "";
        document.getElementById('in-dep').value = "0";
    }

    // الاستماع المتزامن للبيانات من Firestore
    db.collection("orders").onSnapshot(function(snap) {
        allData = [];
        snap.forEach(function(doc) { 
            var d = doc.data(); 
            d.id = doc.id; 
            allData.push(d); 
        });
        allData.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        renderHome();
        if(currentCust) renderDetails(currentCust);
    }, function(error) {
        console.error("Firebase Snapshot Error: ", error);
        alert("فشل جلب البيانات من السيرفر. تأكد من إعدادات القواعد الحماية (Rules): " + error.message);
    });

    // رندر قائمة الزبائن في الواجهة الأساسية
    function renderHome() {
        var list = document.getElementById('cust-list');
        var names = [];
        allData.forEach(function(o) { if(names.indexOf(o.customer) === -1 && o.customer) names.push(o.customer); });
        var tr=0, td=0;
        list.innerHTML = names.length ? "" : '<p class="text-center py-20 text-gray-400">لا يوجد زبائن حالياً</p>';
        names.forEach(function(n) {
            var myO = allData.filter(function(o) { return o.customer === n; });
            var r=0, d=0;
            myO.forEach(function(o) { r+=(o.remaining||0); d+=(o.deposit||0); });
            tr+=r; td+=d;
            var div = document.createElement('div');
            div.className = "cust-card flex justify-between items-center mb-2";
            div.onclick = function() { 
                currentCust = n; 
                hideAll(); 
                document.getElementById('detail-view').style.display='block'; 
                document.getElementById('det-name').innerText = n; 
                renderDetails(n); 
            };
            div.innerHTML = '<div><h3 class="font-bold">'+n+'</h3><p class="text-[10px] text-gray-400">'+myO.length+' طلبات</p></div><div class="text-red-600 font-bold text-sm">'+r.toLocaleString()+'</div>';
            list.appendChild(div);
        });
        document.getElementById('sum-rem').innerText = tr.toLocaleString();
        document.getElementById('sum-dep').innerText = td.toLocaleString();
    }

    // رندر تفاصيل المشتريات للزبون المختار
    function renderDetails(customerName) {
        var list = document.getElementById('items-list');
        var myO = allData.filter(function(o) { return o.customer === customerName; });
        var totalRem = 0;
        list.innerHTML = "";
        
        myO.forEach(function(o) {
            totalRem += (o.remaining || 0);
            var div = document.createElement('div');
            div.className = "item-box";
            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h4 class="font-bold text-base text-gray-800">${o.item}</h4>
                    <span class="text-[11px] bg-gray-100 px-2 py-1 rounded text-gray-500">العدد: ${o.quantity}</span>
                </div>
                <p class="text-xs text-gray-600 mb-3 whitespace-pre-line">${o.details || 'لا توجد مواصفات فنية'}</p>
                <div class="grid grid-cols-3 gap-2 border-t pt-2 text-center text-xs">
                    <div><span class="text-gray-400 block text-[10px]">السعر الكلي</span><span class="font-bold text-gray-700">${(o.price||0).toLocaleString()}</span></div>
                    <div><span class="text-gray-400 block text-[10px]">المحصل</span><span class="font-bold text-green-600">${(o.deposit||0).toLocaleString()}</span></div>
                    <div><span class="text-gray-400 block text-[10px]">المتبقي</span><span class="font-bold text-red-600">${(o.remaining||0).toLocaleString()}</span></div>
                </div>
            `;
            list.appendChild(div);
        });
        document.getElementById('det-total').innerText = "إجمالي ديون الزبون: " + totalRem.toLocaleString() + " د.ع";
    }

    // دالة حفظ البيانات وتجنب مشكلة الـ Refresh التلقائي
    function saveData(e) {
        if(e) e.preventDefault(); // منع المتصفح من تحديث الصفحة فوراً

        var customer = document.getElementById('in-c').value.trim();
        var item = document.getElementById('in-i').value.trim();
        var details = document.getElementById('in-d').value.trim();
        var quantity = parseInt(document.getElementById('in-q').value) || 0;
        var price = parseFloat(document.getElementById('in-p').value) || 0;
        var deposit = parseFloat(document.getElementById('in-dep').value) || 0;
        var remaining = price - deposit;

        var saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.innerText = "جاري الحفظ سحابياً... ⏳";

        db.collection("orders").add({
            customer: customer,
            item: item,
            details: details,
            quantity: quantity,
            price: price,
            deposit: deposit,
            remaining: remaining,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(function() {
            alert("تم حفظ الطلب بنجاح سحابياً! ✅");
            saveBtn.disabled = false;
            saveBtn.innerText = "تأكيد وحفظ الطلب ✅";
            currentCust = customer;
            hideAll();
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('det-name').innerText = customer;
        })
        .catch(function(error) {
            console.error("Firebase Add Error: ", error);
            alert("فشل الحفظ بالسيرفر! السبب الغالب هو ضبط القواعد (Rules) في فايربيس.\n\nتفاصيل الخطأ: " + error.message);
            saveBtn.disabled = false;
            saveBtn.innerText = "تأكيد وحفظ الطلب ✅";
        });
    }
</script>
</body>
</html>
