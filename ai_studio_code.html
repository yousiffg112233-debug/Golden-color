<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مطبعة اللون الذهبي - كاشف أخطاء الحفظ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <style>
        * { font-family: 'Cairo', sans-serif !important; }
        body { background-color: #f0f2f5; padding-bottom: 100px; }
        .log-error { background: #fee2e2; border: 2px solid #ef4444; color: #b91c1c; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; font-size: 12px; direction: ltr; text-align: left; }
        .gold-btn { background: #d4af37; color: black; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div class="p-4 max-w-xl mx-auto">
    <!-- شعار المطبعة -->
    <div class="flex flex-col items-center mb-6">
        <div class="w-16 h-16 bg-black rounded-2xl flex items-center justify-center border-2 border-[#d4af37] shadow-xl mb-2">
            <span class="text-[#d4af37] font-bold text-2xl">G</span>
        </div>
        <h1 class="text-xl font-bold">مطبعة اللون الذهبي</h1>
    </div>

    <!-- كاشف الأخطاء -->
    <div id="error-box" class="log-error">
        <b>حدث خطأ في الاتصال بالسحاب:</b>
        <p id="error-msg"></p>
    </div>

    <!-- شاشة الإضافة -->
    <div id="add-form" class="bg-white p-6 rounded-3xl shadow-xl space-y-4">
        <h2 class="text-lg font-bold border-b pb-2">إرسال طلب تجريبي للسحاب</h2>
        <input type="text" id="cust" placeholder="اسم الزبون" class="w-full p-4 border rounded-2xl outline-none">
        <input type="text" id="item" placeholder="اسم المنتج" class="w-full p-4 border rounded-2xl outline-none">
        <input type="number" id="price" placeholder="السعر" class="w-full p-4 border rounded-2xl outline-none">
        
        <button id="save-btn" onclick="testSave()" class="gold-btn shadow-lg active:scale-95 transition-transform">
            تأكيد وحفظ الطلب ✅
        </button>
    </div>

    <!-- قائمة الزبائن (للتأكد من القراءة) -->
    <div id="cust-list" class="mt-8 space-y-4">
        <h3 class="font-bold text-gray-500">البيانات الموجودة في السحاب حالياً:</h3>
        <div id="list-container" class="text-center py-10 text-gray-400 italic">بانتظار وصول البيانات...</div>
    </div>
</div>

<script>
    // بياناتك الخاصة
    const firebaseConfig = {
        apiKey: "AIzaSyBnfABXbY5qxnirc3sumFX4TTOtlfJEM7s",
        projectId: "golden-92eb1",
        appId: "1:682494914009:web:518e6365b0da3627affdc8"
    };

    // بدء التشغيل مع فحص الأخطاء
    try {
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
    } catch (e) {
        showError("خطأ في تشغيل المكتبات: " + e.message);
    }

    // وظيفة الحفظ مع تقرير الخطأ
    function testSave() {
        const btn = document.getElementById('save-btn');
        const c = document.getElementById('cust').value;
        const i = document.getElementById('item').value;
        const p = document.getElementById('price').value;

        if(!c || !i) { alert("أكمل البيانات أولاً"); return; }

        btn.innerText = "جاري الإرسال للسحاب... ⏳";
        btn.disabled = true;
        document.getElementById('error-box').style.display = 'none';

        db.collection("orders").add({
            customer: c,
            itemName: i,
            totalPrice: parseFloat(p) || 0,
            remaining: parseFloat(p) || 0,
            deposit: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            alert("مبروك! السحاب شغال والحفظ تم بنجاح ✅");
            btn.innerText = "تأكيد وحفظ الطلب ✅";
            btn.disabled = false;
            document.getElementById('cust').value = "";
            document.getElementById('item').value = "";
        })
        .catch((error) => {
            btn.innerText = "فشل الحفظ ❌";
            btn.disabled = false;
            showError(error.code + " : " + error.message);
        });
    }

    function showError(msg) {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-msg').innerText = msg;
    }

    // جلب البيانات للتأكد أن القراءة تعمل
    db.collection("orders").orderBy("createdAt", "desc").limit(5).onSnapshot(snap => {
        const container = document.getElementById('list-container');
        if(snap.empty) {
            container.innerHTML = "السحاب فارغ تماماً حالياً";
            return;
        }
        let html = "";
        snap.forEach(doc => {
            const data = doc.data();
            html += `<div class="bg-white p-4 rounded-xl border-r-4 border-green-500 shadow-sm text-sm">
                        <b>${data.customer}</b>: ${data.itemName} (${data.totalPrice} ر.س)
                     </div>`;
        });
        container.innerHTML = html;
    }, err => {
        showError("خطأ في القراءة: " + err.message);
    });

</script>
</body>
</html>
