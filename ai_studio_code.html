<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبعة اللون الذهبي - PRO</title>
    <!-- المكتبات الأساسية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #f4f7f6; padding-bottom: 90px; }
        .customer-card { background: white; border-radius: 15px; border-right: 8px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .item-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-right: 4px solid #735c00; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #735c00 100%); }
        #notif { position: fixed; top: 10px; width: 90%; left: 5%; z-index: 2000; display: none; background: #1a1a1a; color: #d4af37; border-radius: 10px; border: 1px solid #d4af37; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div id="notif" class="p-4 shadow-2xl items-center gap-3 animate-bounce">
    <span class="material-symbols-outlined">notifications_active</span>
    <span id="notif-text" class="text-sm font-bold"></span>
</div>

<div id="main">
    <!-- شاشة التحميل -->
    <div id="loading" class="flex flex-col items-center justify-center min-h-screen">
        <div class="animate-spin text-[#d4af37] mb-4 text-5xl">🔄</div>
        <p class="text-gray-500 font-bold">جاري الاتصال بمطبعة اللون الذهبي...</p>
    </div>

    <!-- قائمة الزبائن -->
    <div id="home" class="hidden p-4 max-w-xl mx-auto">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 gold-gradient rounded-full flex items-center justify-center shadow-lg mb-2">
                <span class="material-symbols-outlined text-white text-3xl">format_paint</span>
            </div>
            <h1 class="text-xl font-bold">مطبعة اللون الذهبي</h1>
        </div>
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-lg text-gray-700">الزبائن الحاليين</h2>
            <span id="c-count" class="bg-black text-[#d4af37] px-2 py-1 rounded-full text-[10px] font-bold">0 زبون</span>
        </div>
        <div id="customers-list" class="space-y-4"></div>
    </div>

    <!-- ملف الزبون -->
    <div id="details" class="hidden p-4 max-w-xl mx-auto">
        <button onclick="showHome()" class="mb-4 text-gray-400 font-bold no-print">← رجوع</button>
        <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-[#d4af37] mb-6">
            <h2 id="det-cust-name" class="text-2xl font-bold text-gray-800"></h2>
            <div class="flex justify-between items-center mt-4 bg-red-50 p-4 rounded-xl">
                <span class="text-sm font-bold text-red-800">إجمالي المتب
