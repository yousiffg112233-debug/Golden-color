<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>نظام مطبعة اللون الذهبي - الإصدار المحمي</title>
    
    <!-- المكتبات الأساسية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f0f2f5; margin: 0; padding-bottom: 90px; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #735c00 100%); }
        .card { background: white; border-radius: 20px; border-right: 8px solid #d4af37; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .item-box { background: white; border: 1px solid #e2e8f0; border-radius: 15px; padding: 15px; border-right: 4px solid #1a1a1a; margin-bottom: 12px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; background: white; margin-bottom: 10px; }
        input:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        
        /* تنسيق PDF */
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .print-header { display: flex !important; justify-content: space-between; align-items: center; border-bottom: 3px solid #d4af37; padding-bottom: 20px; margin-bottom: 30px; }
            .item-box { border: 1px solid #ddd !important; break-inside: avoid; }
        }
    </style>
</head>
<body>

<!-- نظام الحماية (تسجيل الدخول) -->
<div id="login-screen" class="fixed inset-0 bg-[#f0f2f5] z-[9999] flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-[#d4af37] text-center">
        <div class="w-20 h-20 gold-gradient rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
            <span class="material-symbols-outlined text-white text-4xl">lock</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">مطبعة اللون الذهبي</h1>
        <p class="text-gray-400 text-sm mb-6">يرجى إدخال رمز الدخول للأمان</p>
        <input type="password" id="pin-code" placeholder="أدخل الرمز السري" class="text-center text-2xl tracking-[10px]">
        <button onclick="checkPin()" class="w-full bg-black text-[#d4af37] py-4 rounded-2xl font-bold text-lg shadow-xl mt-2">دخول النظام</button>
    </div>
</div>

<div id="main-app" class="hidden">
    <!-- هيدر التطبيق -->
    <header class="bg-white p-5 shadow-sm border-b-2 border-[#d4af37] flex justify-between items-center no-print">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center border border-[#d4af37] shadow-md text-[#d4af37] font-bold">G</div>
            <h1 class="text-xl font-bold text-gray-800">اللون الذهبي</h1>
        </div>
        <button onclick="location.reload()" class="material-symbols-outlined text-gray-400">refresh</button>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <!-- شاشة الزبائن -->
        <div id="view-home">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-2xl shadow-sm border-b-4 border-red-500 text-center">
                    <p class="text-[10px] text-gray-400 font-bold">إجمالي ديون السوق</p>
                    <p id="sum-rem" class="text-lg font-bold text-red-600">0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border-b-4 border-green-500 text-center">
                    <p class="text-[10px] text-gray-400 font-bold">إجمالي المحصل</p>
                    <p id="sum-dep" class="text-lg font-bold text-green-600">0</p>
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="font-bold text-gray-700">مجلدات العملاء</h2>
                <input type="text" oninput="searchCust(this.value)" placeholder="بحث عن زبون..." class="!w-32 !p-1 !text-xs !mb-0">
            </div>

            <div id="customers-list" class="space-y-4">
                <p class="text-center py-20 text-gray-300 font-bold">جاري مزامنة السحاب...</p>
            </div>
        </div>

        <!-- شاشة ملف الزبون -->
        <div id="view-detail" class="hidden">
            <div class="print-header hidden">
                <div class="text-right">
                    <h1 style="font-size: 28px; color: #735c00; margin: 0;">مطبعة اللون الذهبي</h1>
                    <p style="font-size: 14px; color: #666;">كشف حساب عميل رسمي</p>
                </div>
                <div class="text-left">
                    <p id="p-date" style="font-size: 12px;"></p>
                </div>
            </div>

            <button onclick="showHome()" class="mb-4 text-gray-500 font-bold flex items-center gap-1 no-print">
                <span class="material-symbols-outlined text-sm">arrow_back</span> رجوع
            </button>

            <div class="bg-black text-white p-6 rounded-3xl mb-6 relative shadow-xl border-r-8 border-[#d4af37]">
                <h2 id="det-name" class="text-2xl font-bold mb-1 text-[#d4af37]"></h2>
                <p id="det-total" class="text-xs opacity-80 font-bold"></p>
                <button onclick="window.print()" class="absolute top-5 left-5 bg-white/20 p-2 rounded-xl no-print flex items-center gap-1 text-[10px]">
                    <span class="material-symbols-outlined text-sm">picture_as_pdf</span> PDF
                </button>
            </div>

            <div id="items-list" class="space-y-4"></div>
        </div>

        <!-- شاشة الإضافة -->
        <div id="view-add" class="hidden">
            <h2 class="text-xl font-bold mb-6 text-[#735c00]">إصدار طلب شغل جديد</h2>
            <div class="bg-white p-6 rounded-3xl shadow-lg space-y-3">
                <label class="text-[10px] font-bold text-gray-400 mr-2 uppercase">اسم الزبون</label>
                <input type="text" id="in-c" placeholder="مثلاً: مطعم الصقر">
                
                <label class="text-[10px] font-bold text-gray-400 mr-2 uppercase">المنتج (الآيتم)</label>
                <input type="text" id="in-i" placeholder="مثلاً: كرتون بيتز
